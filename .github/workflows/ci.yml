name: CI

on:
  push:
    branches: ["**"]
  # Only PRs targeting main. Branches of this repo already run on push, and
  # matching "**" here would run the whole CI twice for the same commit.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes the running CI for the same branch — except on main,
# where an in-flight run may be deploying and must finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No job writes to the repository: the deploy authenticates with Cloudflare's
# own token. Declared here so it does not depend on the repo-wide default,
# which is changed from a settings screen, outside this file.
permissions:
  contents: read

env:
  # Declared once: a deploy compiled with a different Flutter than the one that
  # ran the tests would still report green.
  FLUTTER_VERSION: 3.44.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Test
        # Excludes tests tagged "chrome-only": they build the app's widget
        # tree, which reaches `dart:js_interop` (file picker, backup download)
        # through `core/router.dart`. That library does not exist on the Dart
        # VM this job runs on — see the `widget-tests-chrome` job below.
        run: flutter test --exclude-tags=chrome-only

  widget-tests-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Test (chrome platform)
        # Covers tests tagged "chrome-only": widget tests that build the real
        # app shell (needs `dart:js_interop`, which only exists when compiled
        # for the web) and, if present, the IndexedDB backup round-trip test.
        # ubuntu-latest ships Chrome preinstalled, so no extra setup needed.
        run: flutter test --platform chrome --tags=chrome-only

  deploy:
    needs: [test, widget-tests-chrome]
    # A pull_request event never carries this ref (it runs on refs/pull/N/merge),
    # so the ref alone already narrows this down to push and workflow_dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Before the build: a broken environment should fail in seconds, not
      # after the release compile, which is the longest step of this job.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build web release
        run: tool/build_web.sh

      - name: Deploy to Cloudflare Workers
        # Pinned to the major: there is no package.json here, so a bare `npx
        # wrangler` would pull whatever is latest on the day of the deploy —
        # and wrangler has changed `wrangler.toml` keys across majors before.
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
