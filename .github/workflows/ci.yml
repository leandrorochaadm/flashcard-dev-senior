name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        # Excludes tests tagged "chrome-only": they build the app's widget
        # tree, which reaches `dart:js_interop` (file picker, backup download)
        # through `core/router.dart`. That library does not exist on the Dart
        # VM this job runs on — see the `widget-tests-chrome` job below.
        run: flutter test --exclude-tags=chrome-only

  widget-tests-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test (chrome platform)
        # Covers tests tagged "chrome-only": widget tests that build the real
        # app shell (needs `dart:js_interop`, which only exists when compiled
        # for the web) and, if present, the IndexedDB backup round-trip test.
        # ubuntu-latest ships Chrome preinstalled, so no extra setup needed.
        run: flutter test --platform chrome --tags=chrome-only

  deploy:
    needs: [test, widget-tests-chrome]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: tool/build_web.sh

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
