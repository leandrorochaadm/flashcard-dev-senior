<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cartões de estudo com repetição espaçada para a entrevista de Flutter sênior. Funciona sem internet.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flashcards">
  <meta name="theme-color" content="#2F6FEB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flashcards</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Keeps an installed PWA from running a stale bundle for days.

    Deliberately not driven by service-worker events. `web/sw.js` serves the
    shell from cache so the app opens offline, which means a suspended PWA can
    go a long time without ever asking the network what version it is on.

    So the check is explicit: poll `version.json` — which `sw.js` always
    fetches from the network, never from cache — and reload when the build
    number changes. That number is bumped by the pre-push hook, so every
    deploy is visible to an app that has been sitting in the background.

    The reload waits until the page is hidden: reloading under someone
    mid-card would throw away the question they are reading. The unfinished
    session is persisted (`SessionRepository.unfinished()`), so nothing is lost
    either way — this only avoids the jolt.
  -->
  <script>
    // Our own service worker, because Flutter's is deprecated as of 3.44 and
    // caches nothing. `tool/build_web.sh` passes --pwa-strategy=none so this
    // is the only worker registered.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (error) {
          // Registration fails on http:// origins other than localhost, and in
          // some private-browsing modes. The app still works — just online.
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>

  <script>
    (function () {
      var loadedVersion = null;
      var pendingReload = false;

      function readVersion() {
        return fetch('version.json', { cache: 'no-store' })
          .then(function (response) { return response.json(); })
          .then(function (data) { return data.version + '+' + data.build_number; })
          .catch(function () {
            // Offline or unreachable: keep running what is already loaded.
            return null;
          });
      }

      // The worker announces itself once the new cache is in place and the old
      // one is gone. Only then is a reload safe.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'activated') pendingReload = true;
        });
      }

      function check() {
        readVersion().then(function (version) {
          if (version === null) return;
          if (loadedVersion === null) {
            loadedVersion = version;
            return;
          }
          if (version === loadedVersion) return;

          // A changed version.json means a deploy happened, but the browser
          // does not re-fetch sw.js on its own — `register()` only checks
          // according to the HTTP cache, which left the app pinned to the old
          // build in testing. `update()` forces the check; the worker then
          // installs, activates, and messages back.
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) reg.update();
            });
          } else {
            pendingReload = true;
          }
        });
      }

      check();
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (pendingReload) window.location.reload();
        } else {
          check();
        }
      });
    })();
  </script>
</body>
</html>
