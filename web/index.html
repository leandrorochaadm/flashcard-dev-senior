<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cartões de estudo com repetição espaçada para a entrevista de Flutter sênior. Funciona sem internet.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flashcards">
  <meta name="theme-color" content="#2F6FEB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flashcards</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Keeps an installed PWA from running a stale bundle for days.

    NOT done through the service worker, on purpose. As of Flutter 3.44 the
    generated `flutter_service_worker.js` is a self-destroying worker: it calls
    `skipWaiting()` on install and `registration.unregister()` on activate.
    It caches nothing. So the usual recipe — listen for `updatefound`, post
    `skipWaiting` to the waiting worker — has nothing to talk to here.

    What is left is the HTTP cache, which `_headers` marks `no-cache` on the
    entry points. That is enough for a reload to pick up a new build, but an
    installed PWA is suspended rather than reloaded, so nothing triggers it.
    This polls `version.json` — regenerated by every `flutter build` and
    carrying the build number the pre-push hook bumps — and reloads when it
    changes.

    The reload waits until the page is hidden: reloading under someone
    mid-card would throw away the question they are reading. The unfinished
    session is persisted (`SessionRepository.unfinished()`), so nothing is lost
    either way — this only avoids the jolt.
  -->
  <script>
    (function () {
      var loadedVersion = null;
      var pendingReload = false;

      function readVersion() {
        return fetch('version.json', { cache: 'no-store' })
          .then(function (response) { return response.json(); })
          .then(function (data) { return data.version + '+' + data.build_number; })
          .catch(function () {
            // Offline or unreachable: keep running what is already loaded.
            return null;
          });
      }

      function check() {
        readVersion().then(function (version) {
          if (version === null) return;
          if (loadedVersion === null) {
            loadedVersion = version;
            return;
          }
          if (version !== loadedVersion) pendingReload = true;
        });
      }

      check();
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (pendingReload) window.location.reload();
        } else {
          check();
        }
      });
    })();
  </script>
</body>
</html>
